name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/chupps/frontend
            git pull
            tmux kill-session -t frontend 2>/dev/null || true
            npm install
            npm run build
            tmux kill-session -t frontend 2>/dev/null || true
            tmux new-session -d -s frontend "npm start"